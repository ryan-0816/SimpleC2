---
- name: Check for Python 3
  ansible.builtin.command: python3 --version
  changed_when: false

- name: Create agent directory
  ansible.builtin.file:
    path: "{{ agent_install_dir_linux }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Install agent script
  ansible.builtin.copy:
    src: ../agent.py
    dest: "{{ agent_install_dir_linux }}/agent.py"
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Install controller CA
  ansible.builtin.copy:
    src: "{{ controller_ca_file }}"
    dest: "{{ agent_install_dir_linux }}/controller-ca.pem"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install environment file
  ansible.builtin.template:
    src: templates/agent.env.j2
    dest: /etc/simple-c2-agent.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true

- name: Install systemd service
  ansible.builtin.template:
    src: templates/agent.service.j2
    dest: /etc/systemd/system/simple-c2-agent.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Enable and start agent
  ansible.builtin.systemd:
    name: simple-c2-agent
    daemon_reload: true
    enabled: true
    state: restarted
  become: true
